# Render Blueprint: the API (Docker) and the web app (static site).
# The database is external (Neon free Postgres) because Render's free Postgres expires after 30 days.
# Docs: https://render.com/docs/blueprint-spec
services:
  # API: NestJS service in backend-nest/. Runs migrations on start-up.
  - type: web
    name: alchemyx-erp
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend-nest/Dockerfile
    dockerContext: ./backend-nest
    autoDeploy: true
    envVars:
      # Neon pooled connection string (postgresql://…?sslmode=verify-full).
      - key: DATABASE_URL
        sync: false
      # Free instances are small; a big pool just burns Neon connections.
      - key: DB_POOL_SIZE
        value: "3"
      # Public URL of the web app. Used for password-reset links.
      - key: FRONTEND_URL
        sync: false
      # Origins allowed to call the API: the web app's URL (and the phone app's origins).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Colombo
      # Creates the first Super Admin on boot, when the database has no members.
      # Delete BOOTSTRAP_ADMIN_PASSWORD after the first successful sign-in.
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false

  # Web app: the React build, served as static files. Point VITE_API_URL at the API service.
  - type: web
    name: alchemyx-erp-web
    runtime: static
    rootDir: frontend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
