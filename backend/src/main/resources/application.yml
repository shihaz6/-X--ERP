spring:
  application:
    name: alchemyx-erp
  datasource:
    # Neon Postgres. Example: jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway (db/migration). Hibernate must never alter it.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${PORT:8080}

app:
  timezone: ${APP_TIMEZONE:Asia/Colombo}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  session-ttl: ${SESSION_TTL:12h}
  max-upload-bytes: 26214400
  # Used only when the database has no members yet, to create the first Super Admin.
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
