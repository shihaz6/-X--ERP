spring:
  application:
    name: alchemyx-erp
  mail:
    # Leave MAIL_HOST empty to log emails instead of sending them.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: true
  datasource:
    # Neon Postgres. Example: jdbc:postgresql://<host>/<db>?sslmode=require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway (db/migration). Hibernate must never alter it.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

server:
  port: ${PORT:8080}

app:
  timezone: ${APP_TIMEZONE:Asia/Colombo}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  session-ttl: ${SESSION_TTL:12h}
  max-upload-bytes: 26214400
  mail-from: ${MAIL_FROM:AlchemyX <no-reply@alchemyx.local>}
  frontend-url: ${FRONTEND_URL:http://localhost:8443}
  # Daily jobs: billing at 06:00, overdue reminders at 07:00 (workspace timezone).
  billing-cron: ${BILLING_CRON:0 0 6 * * *}
  overdue-cron: ${OVERDUE_CRON:0 0 7 * * *}
  # Used only when the database has no members yet, to create the first Super Admin.
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:Administrator}
